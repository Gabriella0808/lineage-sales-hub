name: Desktop App Build (Windows + macOS)

# Manual trigger ONLY. This never runs on push or on a schedule — someone
# has to explicitly click "Run workflow" in the GitHub Actions tab. That's
# deliberate: this builds and signs real, distributable installers.
#
# By default it creates a DRAFT GitHub Release — visible only to repo
# collaborators, not linked from "latest", and not something the desktop
# app's auto-updater would ever pick up. A human has to explicitly click
# "Publish release" in the GitHub UI (or re-run with publish_release=true)
# before it's actually live. That's the real safety gate, not the input
# flag alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.1 (must match src-tauri/tauri.conf.json)"
        required: true
      publish_release:
        description: "Publish immediately instead of leaving it as a draft"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # --- macOS signing setup only ---
      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=ci-build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm cert.p12
          curl -s -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security add-certificates -k "$KEYCHAIN" /tmp/DeveloperIDG2CA.cer
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > /tmp/apple-api-key.p8

      # --- Windows signing setup only ---
      # Tauri calls tauri.conf.json's bundle.windows.signCommand automatically
      # during `tauri build` -- no separate post-build step needed, just the
      # CLI tool installed and Azure credentials available as env vars (the
      # Azure SDK convention trusted-signing-cli reads them from).
      - name: Install Azure Trusted Signing CLI
        if: matrix.platform == 'windows-latest'
        run: cargo install trusted-signing-cli --locked

      # Diagnostic only: Tauri's bundler swallows this tool's own
      # stdout/stderr when it's invoked as a signCommand, so a real
      # failure there only ever shows "failed to run trusted-signing-cli"
      # with zero detail. Running it directly here, against a throwaway
      # file, surfaces its actual error message in the CI log.
      - name: Test Azure Trusted Signing CLI (diagnostic)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Copy-Item "$env:SystemRoot\System32\notepad.exe" test-sign.exe
          trusted-signing-cli.exe -e https://eus.codesigning.azure.net/ -a lineage-collections -c lineage-collections test-sign.exe

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/apple-api-key.p8
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: "Lineage Collections v${{ github.event.inputs.version }}"
          releaseDraft: ${{ github.event.inputs.publish_release != 'true' }}
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
